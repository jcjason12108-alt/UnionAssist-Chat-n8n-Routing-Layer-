name: PHP quality

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
          coverage: none
      - name: PHP syntax and security smoke checks
        run: |
          php -l n8n-chatagent-for-unions.php
          php -l includes/chat-proxy-payload.php
          php -l includes/chat-session-verification.php
          php tests/chat-proxy-payload-smoke.php
          php tests/chat-session-verification-smoke.php
